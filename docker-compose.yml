services:
  postgres:
    image: postgres:16-alpine
    container_name: recover_net_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recover_net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recover_net"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
