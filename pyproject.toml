[project]
name = "recover-net"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.19.1",
    "blindlog>=1.2.0",
    "fastapi>=0.141.1",
    "openai>=3.6.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]
